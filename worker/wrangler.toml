name = "resume-chat"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[ai]
binding = "AI"

# Per-IP limit so bots can't burn the free daily quota.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[vars]
ALLOWED_ORIGINS = "https://deepanshu1345.github.io,http://localhost:5173,http://localhost:4173"
